[package]
name = "truce-example-webview"
# Internal-only - workspace demonstration, not for crates.io.
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "truce-example-webview-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au", "aax"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
aax = ["dep:truce-aax"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]

[dependencies]
truce = { workspace = true }
truce-core = { workspace = true }
truce-params = { workspace = true }
truce-clap = { workspace = true, optional = true }
truce-vst3 = { workspace = true, optional = true }
truce-vst2 = { workspace = true, optional = true }
truce-aax = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
truce-standalone = { workspace = true, features = ["gui"], optional = true }
truce-loader = { workspace = true }

# The webview: WKWebView on macOS, WebView2 on Windows. Linux would need
# webkit2gtk and a GTK widget tree, which a plug-in's X11 parent window
# can't host, so the example opens no editor there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.58"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSResponder",
    "NSWindow",
    "NSControl",
    "NSTextField",
    "NSColor",
] }

[dev-dependencies]
truce-test = { workspace = true }

[lints]
workspace = true
